  # 01.md 令和6年分 年末調整のしかた
  - context: |
    questions_and_answers:
      # - question: |
      #     年末調整に関する相談にAIが自動で回答してくれる、チャットボットの名前は何ですか？
      #   answer: |
      #     税務職員ふたば
      - question: |
          年末調整手続の電子化を行うことのメリットは何ですか？
        answer: |
          給与の支払者（勤務先）及び給与所得者（従業員）それぞれにおいて、書類の作成や確認、保管などの業務全般が大幅に効率化されます。
      - question: |
          給料や報酬などについて源泉徴収をした所得税及び復興特別所得税の納期限はいつですか？
        answer: |
          納期の特例の承認を受けているか否かで異なります。
          納期の特例の承認を受けていない場合は、給料や報酬などを支払った月の翌月１０日が納期限です。
          納期の特例の承認を受けている場合は、１月から６月までの分は７月１０日、７月から１２月までの分は翌年の１月２０日が納期限です。
      - question: |
          納付する税額がない場合はどうしますか？
        answer: |
          「本税」欄が「0」の所得税徴収高計算書（納付書）を所轄の税務署にe-Taxにより送信又は郵便若しくは信書便により送付又は提出します。
  # 02.md Ⅰ 昨年と比べて変わった点（定額減税）
  - context: |
    questions_and_answers:
      - question: |
          給与所得以外の所得を含めた合計所得金額が1,805万円を超えると見込まれる人について、年末調整時に年調減税額を控除しますか？
        answer: |
          いいえ、年調減税額を控除しないで年末調整を行います。
      - question: |
          合計所得金額が1,805万円を超えるかどうかの確認はどのようにしますか？
        answer: |
          基礎控除申告書などにより把握した合計所得金額を用いて確認します。
      - question: |
          年調減税額の計算方法を教えて下さい。
        answer: |
          「本人30,000円」と「同一生計配偶者と扶養親族１人につき30,000円」を合計します。
  # 03.md Ⅱ 年末調整とは
  - context: |
    questions_and_answers:
      - question: |
          年の中途で死亡により退職した人は、年末調整の対象となりますか？
        answer: |
          年末調整の対象となります。
      - question: |
          継続して同一の雇用主に雇用されないいわゆる日雇労働者など（日額表の丙欄適用者）は年末調整の対象となりますか？
        answer: |
          年末調整の対象となりません。
      - question: |
          年の中途で、海外の支店へ転勤したことなどの理由により、非居住者となった人について、年末調整を行う時はいつですか？
        answer: |
          非居住者となった時に年末調整を行います。
  # 05.md Ⅲ 年末調整のしかた １ 年末調整の手順（図）（省略）
  # 07.md ２ 各種控除額の確認
  - context: |
    questions_and_answers:
      - question: |
          給与所得者の扶養控除等（異動）申告書はいつ提出しますか？
        answer: |
          原則として本年最初に給与の支払を受ける時までに給与の支払者に提出します。年の中途で控除対象扶養親族の数などに異動があった場合には、その都度異動申告をします。
      - question: |
          扶養親族とは誰ですか？
        answer: |
          所得者と生計を一にする親族（配偶者、青色事業専従者として給与の支払を受ける人及び白色事業専従者を除きます。）で、合計所得金額が48万円以下の人をいいます。
      - question: |
          年齢１６歳未満の扶養親族（年少扶養親族）は、控除対象扶養親族に該当しますか？
        answer: |
          控除対象扶養親族に該当しません。
      - question: |
          非居住者とは誰ですか？
        answer: |
          居住者以外の個人をいいます。
      - question: |
          居住者とは誰ですか？
        answer: |
          国内に住所を有し、又は現在まで引き続いて１年以上居所を有する個人をいいます。
      - question: |
          年少扶養親族とは誰ですか？
        answer: |
          扶養親族のうち、年齢１６歳未満の人（平成２１年１月２日以後に生まれた人）をいいます。
      - question: |
          所得者の年調減税額の計算の対象となる扶養親族とは誰ですか？
        answer: |
          控除対象扶養親族及び年少扶養親族です（いずれも居住者に限ります。）。
      - question: |
          特定扶養親族とは誰ですか？
        answer: |
          控除対象扶養親族のうち、年齢19歳以上23歳未満の人（平成１４年１月２日から平成１８年１月１日までの間に生まれた人）をいいます。
      - question: |
          老人扶養親族とは誰ですか？
        answer: |
          控除対象扶養親族のうち、年齢７０歳以上の人（昭和３０年１月１日以前に生まれた人）をいいます。
      - question: |
          同居老親等とは誰ですか？
        answer: |
          老人扶養親族のうち、所得者又はその配偶者（以下「所得者等」といいます。）の直系尊属（父母や祖父母などをいいます。）で所得者等のいずれかとの同居を常況としている人をいいます。
      - question: |
          同一生計配偶者とは誰ですか？
        answer: |
          所得者と生計を一にする配偶者（青色事業専従者として給与の支払を受ける人及び白色事業専従者を除きます。）で、合計所得金額が48万円以下の人をいいます。
      - question: |
          同居特別障害者とは誰ですか？
        answer: |
          同一生計配偶者又は扶養親族のうち特別障害者に該当する人で、所得者、所得者の配偶者又は所得者と生計を一にするその他の親族のいずれかとの同居を常況としている人をいいます。
  # 08.md ２−２ 基礎控除申告書、配偶者控除等（兼定額減税）申告書及び所得金額調整控除申告書の受理と内容の確認
  - context: |
    questions_and_answers:
      - question: |
          基礎控除とは何ですか？
        answer: |
          所得者の合計所得金額が2,500万円以下である場合に、その所得者本人の所得金額の合計額から48万円を限度として、所得者の合計所得金額に応じた金額を控除するというものです。
      - question: |
          配偶者控除とは何ですか？
        answer: |
          所得者（合計所得金額が1,000万円以下の人に限ります。）が控除対象配偶者を有する場合に、その所得者本人の所得金額の合計額から38万円（配偶者が老人控除対象配偶者の場合は、48万円）を限度として、所得者の合計所得金額に応じた金額を控除するというものです。なお、配偶者の合計所得金額が48万円を超えるときは、配偶者控除の適用は受けられません。
      - question: |
          控除対象配偶者とは誰ですか？
        answer: |
          同一生計配偶者（所得者と生計を一にする配偶者（青色事業専従者等を除きます。）で、合計所得金額が48万円以下の人をいいます。）のうち、合計所得金額が1,000万円以下である所得者の配偶者をいいます。
      - question: |
          老人控除対象配偶者とは誰ですか？
        answer: |
          控除対象配偶者のうち、年齢７０歳以上の人（昭和３０年１月１日以前に生まれた人）をいいます。
      - question: |
          配偶者特別控除とは何ですか？
        answer: |
          所得者（合計所得金額が1,000万円以下の人に限ります。）が生計を一にする配偶者（合計所得金額が133万円以下の人に限ります。）で控除対象配偶者に該当しない人を有する場合に、その所得者本人の所得金額の合計額から38万円を限度として、所得者の合計所得金額と配偶者の合計所得金額に応じた金額を控除するというものです。なお、配偶者の合計所得金額が48万円以下であるとき又は133万円を超えるときは、配偶者特別控除の適用は受けられません。
      - question: |
          所得金額調整控除とは何ですか？
        answer: |
          所得者（その年中の給与の収入金額が850万円を超える人に限ります。）が、特別障害者に該当する場合又は年齢２３歳未満の扶養親族、特別障害者である同一生計配偶者若しくは特別障害者である扶養親族を有する場合に、その所得者本人の給与所得の金額から15万円を限度として、給与の収入金額（その給与の収入金額が1,000万円を超える場合には、1,000万円）から850万円を控除した金額の100分の10に相当する金額を給与所得の金額から控除するというものです。
  # 09.md ２－３ 保険料控除申告書の受理と内容の確認
  - context: |
    questions_and_answers:
      - question: |
          生命保険料控除の対象となる生命保険料とは何ですか？
        answer: |
          一定の生命保険契約等に基づいて支払った保険料や掛金で所得者本人が支払ったものに限られます。
      - question: |
          保険料控除申告書に添付して提出又は提示が必要な、生命保険料の証明書類は何ですか？
        answer: |
          旧生命保険料にあっては、本年中に支払った一契約の保険料の金額（本年において剰余金の分配や割戻金の割戻しを受けた場合又は分配を受ける剰余金や割戻しを受ける割戻金をもって生命保険料の払込みに充てた場合には、その剰余金や割戻金の額を差し引いた残額）が9,000円を超えるものについて、また、旧生命保険料以外の保険料にあっては、金額の多少にかかわらず全てのものについて、その保険料を支払ったこと等の証明書類又はその証明書類に記載すべき事項を記録した電子証明書等に係る電磁的記録印刷書面です。
      - question: |
          地震保険料控除の対象となる地震保険料とは何ですか？
        answer: |
          所得者本人又は本人と生計を一にする親族が所有している家屋・家財のうち一定のものを保険や共済の目的とし、かつ地震等損害によりこれらの資産について生じた損失の額を塡補する保険金又は共済金が支払われる損害保険契約等に基づく地震等損害部分の保険料や掛金で所得者本人が支払ったものに限られます。
      - question: |
          保険料控除申告書に添付して提出又は提示が必要な、地震保険料の証明書類は何ですか？
        answer: |
          保険料の金額の多少に関係なく、その保険料を支払ったこと等の証明書類又はその証明書類に記載すべき事項を記録した電子証明書等に係る電磁的記録印刷書面です。
      - question: |
          社会保険料控除の対象となる社会保険料とは何ですか？
        answer: |
          所得者本人又は本人と生計を一にする親族の負担すべき社会保険料で、所得者本人が支払ったものに限られます。
      - question: |
          保険料控除申告書に添付して提出又は提示が必要な、社会保険料の証明書類は何ですか？
        answer: |
          国民年金の保険料及び国民年金基金の掛金（以下「保険料等」といいます。）で本人が直接支払ったものについては、支払った保険料等の多少に関係なく、その保険料等を支払ったことの証明書類又はその証明書類に記載すべき事項を記録した電子証明書等に係る電磁的記録印刷書面です。
  # 10.md ２－４ （特定増改築等）住宅借入金等特別控除申告書の受理と内容の確認
  - context: |
    questions_and_answers:
      - question: |
          住宅借入金等特別控除申告書に、添付が必要な証明書は何ですか？
        answer: |
          その人の住所地の税務署長が発行した「年末調整のための（特定増改築等）住宅借入金等特別控除証明書」及び借入等を行った金融機関等が発行した「住宅取得資金に係る借入金の年末残高等証明書」です。
      - question: |
          （特定増改築等）住宅借入金等特別控除とは何ですか？
        answer: |
          個人が住宅借入金等を利用して居住用家屋の新築、取得又は増改築等（以下「取得等」といいます。）をした場合で、一定の要件を満たすときは、その取得等に係る住宅借入金等の年末残高の合計額を基として計算した金額を、居住の用に供した年分以後の各年分の所得税額から控除するというものです。
      - question: |
          個人が住宅借入金等を利用して居住用家屋の新築、取得又は増改築等（以下「取得等」といいます。）をした家屋に入居後、本年１２月３１日まで引き続き居住の用に供していない場合には、（特定増改築等）住宅借入金等特別控除の適用を受けることができますか？
        answer: |
          （特定増改築等）住宅借入金等特別控除の適用を受けることはできません。ただし、居住の用に供さなくなったことが死亡による場合には、死亡した日まで引き続いて自己の居住の用に供していれば、その年については死亡した日の住宅借入金等の残高を基に控除を受けることができます。
