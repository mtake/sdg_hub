  # 20.md 令和６年分の扶養控除額及び障害者等の控除額の合計額の早見表
  - context: |
    questions_and_answers:
      - question: |
          控除対象扶養親族１人あたりの、控除額はいくらですか？
        answer: |
          380,000円です。
      - question: |
          同居特別障害者１人あたりの、控除額はいくらですか？
        answer: |
          750,000円です。
      - question: |
          同居特別障害者以外の特別障害者１人あたりの、控除額はいくらですか？
        answer: |
          400,000円です。
      - question: |
          一般の障害者、寡婦又は勤労学生１人あたりの、控除額はいくらですか？
        answer: |
          270,000円です。
      - question: |
          所得者本人がひとり親に当たる場合の控除額はいくらですか？
        answer: |
          350,000円です。
      - question: |
          同居老親等１人あたりの、控除額はいくらですか？
        answer: |
          200,000円です。
      - question: |
          特定扶養親族１人あたりの、控除額はいくらですか？
        answer: |
          250,000円です。
      - question: |
          同居老親等以外の老人扶養親族１人あたりの、控除額はいくらですか？
        answer: |
          100,000円です。
