  # 14.md ６ 年末調整後に給与の追加払や扶養親族等の異動があった場合の再調整
  - context: |
    questions_and_answers:
      - question: |
          年末調整が終わった後、本年中に本年分の給与を追加して支払うこととなった場合には、どうしますか？
        answer: |
          この追加支給額を先の年末調整の対象となった給与の総額に加えて年末調整のやり直しをすることになります。
      - question: |
          年末調整が終わった後、子が結婚して控除対象扶養親族の数が減少したり、受給者本人が障害者に該当することとなった場合などには、どうしますか？
        answer: |
          これらの異動事項の申告を受け、その異動後の控除対象扶養親族の数などを基にして年末調整のやり直しをすることができます。なお、この場合には、年調減税額が増減する場合があります。この年末調整のやり直しができるのは、「給与所得の源泉徴収票」を受給者に交付することとなる翌年１月末日までです。
      - question: |
          年末調整が終わった後、配偶者控除又は配偶者特別控除の適用を受けた配偶者や受給者本人の合計所得金額の見積額と確定した合計所得金額に差額が生じたことにより、配偶者控除額又は配偶者特別控除額が変動する場合には、どうしますか？
        answer: |
          異動後の状況により、年末調整のやり直しをすることができます。なお、配偶者控除に代えて配偶者特別控除の適用を受ける場合には年調減税額が減少します。この年末調整のやり直しができるのは、「給与所得の源泉徴収票」を受給者に交付することとなる翌年１月末日までです。
      - question: |
          年末調整が終わった後、本年中に生命保険料や地震保険料などを支払った人がいる場合には、どうしますか？
        answer: |
          保険料控除申告書によって申告を受け、その異動後の状況により保険料控除額を再計算し、これを基にして年末調整のやり直しをすることができます。この年末調整のやり直しができるのは、「給与所得の源泉徴収票」を受給者に交付することとなる翌年１月末日までです。
      - question: |
          社会保険料のうち国民年金の保険料若しくは国民年金基金の掛金、小規模企業共済等掛金、 新生命保険料、旧生命保険料（１口9,000円を超えるもの）、介護医療保険料、新個人年金保険料、旧個人年金保険料、地震保険料及び旧長期損害保険料について、翌年１月末日までにその証明書類を提出することを条件として年末調整を行った場合で、その証明書類がその期日までに提出されないときは、どうしますか？
        answer: |
          それらの保険料を除いたところで生命保険料控除の額や地震保険料控除の額などを計算して年末調整のやり直しをし、不足額を徴収することになります。
      - question: |
          年末調整が終わった後、給与所得者から住宅借入金等特別控除申告書の提出があった場合には、どうしますか？
        answer: |
          その申告を基にして年末調整のやり直しをすることができます。この年末調整のやり直しができるのは、「給与所得の源泉徴収票」を受給者に交付することとなる翌年１月末日までです。
