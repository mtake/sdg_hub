seed_examples:
  - context: |
      IBM と理化学研究所（理研）は本日、米国外およびIBM Quantumデータセンター以外に初めて展開されるIBM Quantum System Twoを披露しました。このシステムが稼働開始になったことは、地球上で最も高性能なスーパーコンピューターの１つである日本の「富岳」と同一建屋に設置された最初の量子コンピューターとしても画期的なことです。今回のIBM Quantum System Twoの設置は、経済産業省所管の新エネルギー・産業技術総合開発機構（NEDO）が委託する「ポスト５Ｇ情報通信システム基盤強化研究開発事業」の「量子・スパコンの統合利用技術の開発」プロジェクトの一環として実施されました。
    questions_and_answers:
      - question: |
          IBM と理化学研究所（理研）が設置した量子コンピューターの名前は？
        answer: |
          IBM Quantum System Two
      - question: |
          地球上で最も高性能なスーパーコンピューターの１つである、日本のスーパーコンピューターの名前は？
        answer: |
          富岳
      - question: |
          IBM Quantum System Twoの設置を委託した、経済産業省所管の組織の名前は？
        answer: |
          新エネルギー・産業技術総合開発機構（NEDO）
  - context: |
      理研に設置されたIBM Quantum System Twoは、IBM史上最も高性能な量子プロセッサーである156量子ビットのIBM Quantum Heronプロセッサーを搭載しています。100 量子ビットの階層化回路における2量子ビットのエラー率で測定したIBM Quantum Heronの品質は3x10<sup>-3</sup>（一番良い2量子ビットのエラーは1x10<sup>-3</sup>）で、これは前世代の127量子ビットのIBM Quantum Eagleプロセッサーの10倍です。IBM Quantum Heronの速度は250,000 CLOPS（1秒当たりの回路層操作数）で、これはIBM Quantum Eagleよりも過去1年間で10倍以上向上したことを反映しています。
      このような品質および速度の指標から、156量子ビット規模において、IBM Quantum Heronは世界で最も高性能な量子プロセッサーです。IBM Quantum Heron は、古典コンピューターによる総当たりシミュレーションをはるかに超える量子回路を動作させることが可能であり、「富岳」との接続により、理研の研究チームは量子を中心としたスーパーコンピューティング・アプローチを用いて、基礎化学問題などの高度なアルゴリズムの研究を推進できるようになります。
    questions_and_answers:
      - question: |
          IBM Quantum System Twoに搭載される、量子プロセッサーの名前は？
        answer: |
          IBM Quantum Heron
      - question: |
          IBM Quantum Heronの量子ビット数は？
        answer: |
          156量子ビット
      - question: |
          IBM Quantum Heronの速度を、1秒当たりの回路層操作数（CLOPS）で表すと？
        answer: |
          250,000 CLOPS
  - context: |
      IBM Quantum System Twoは、日本有数のハイパフォーマンス・コンピューティング（HPC）センターである理研計算科学研究センター（R-CCS）内の、「富岳」が設置されている同じ建物内に設置されています。これらのコンピューターは、基礎的な命令レベルで高速ネットワークを介して接続され、「量子を中心としたスーパーコンピューティング」の実証場を形成します。この基礎レベルでの統合により、理研とIBMの研究者は、並列化されたワークロード、低遅延な古典・量子通信プロトコル、高度なコンパイルパスとライブラリーを開発できるようになります。量子システムと古典システムは最終的に異なる計算の強みを提供するため、これにより、各パラダイムが、それぞれに最適なアルゴリズムの各パートをシームレスに実行できるようになります。
    questions_and_answers:
      - question: |
          IBM Quantum System Twoが設置された、ハイパフォーマンス・コンピューティング（HPC）センターの名前は？
        answer: |
          理研計算科学研究センター（R-CCS）
      - question: |
          IBM Quantum System Twoと接続された、古典コンピューターの名前は？
        answer: |
          富岳
      - question: |
          IBM Quantum System Twoと「富岳」の統合により、理研とIBMの研究者が可能になった事は？
        answer: |
          並列化されたワークロード、低遅延な古典・量子通信プロトコル、高度なコンパイルパスとライブラリーの開発
  - context: |
      IBM Quantum System Twoは、IBMのグローバルな量子コンピューター群を拡大するものであり、本日、日本の神戸で開催された記念式典にて正式に発表されました。記念式典には、理研の五神 真理事長、IBM Quantumバイス・プレジデントのジェイ・ガンベッタ（Jay Gambetta）、日本IBM 代表取締役社長の山口明夫のほか、地元国会議員、兵庫県知事、神戸市長、経済産業省、NEDO、文部科学省の代表者も参加しました。
    questions_and_answers:
      - question: |
          IBM Quantum System Twoが発表された記念式典の場所は？
        answer: |
          神戸
      - question: |
          理化学研究所 理事長の名前は？
        answer: |
          五神 真
      - question: |
          日本IBM 代表取締役社長の名前は？
        answer: |
          山口明夫
  - context: |
      IBM Quantum バイス・プレジデントのジェイ・ガンベッタは、次のように述べています。「コンピューティングの未来は量子を中心としたものであり、理研とともにこのビジョンを実現するための大きな一歩を踏み出しています。世界中の業界リーダーや研究機関とともに、世界最大の量子システム群で可能性を拡大し続けています。最新のIBM Quantum Heron を搭載し、「富岳」と接続されたIBM Quantum System Twoにより、科学者やエンジニアは可能性をさらに追及できるようになります」
      理化学研究所 計算科学研究センター 量子HPC連携プラットフォーム部門 部門長 佐藤三久博士 は、次のように述べています。「理研は、「富岳」とIBM Quantum System Twoを連携させることで、日本をハイパフォーマンス・コンピューティングの新時代へと導くことを目指しています。私たちの使命は、科学界と産業界の両方で探求できる実用的な量子HPCハイブリッド・ワークフローを開発・実証することです。これらの2つのシステムを接続することで、このビジョンの実現に向けて重要な一歩を踏み出すことができます」
    questions_and_answers:
      - question: |
          IBM Quantum バイス・プレジデントの名前は？
        answer: |
          ジェイ・ガンベッタ（Jay Gambetta）
      - question: |
          「コンピューティングの未来は量子を中心としたものであり、理研とともにこのビジョンを実現するための大きな一歩を踏み出しています。世界中の業界リーダーや研究機関とともに、世界最大の量子システム群で可能性を拡大し続けています。最新のIBM Quantum Heron を搭載し、「富岳」と接続されたIBM Quantum System Twoにより、科学者やエンジニアは可能性をさらに追及できるようになります」と述べたのは誰ですか？
        answer: |
          ジェイ・ガンベッタ（Jay Gambetta）
      - question: |
          理化学研究所 計算科学研究センター 量子HPC連携プラットフォーム部門 部門長の名前は？
        answer: |
          佐藤三久博士
  - context: |
      理化学研究所 計算科学研究センター 量子HPC連携プラットフォーム部門 部門長 佐藤三久博士 は、次のように述べています。「理研は、「富岳」とIBM Quantum System Twoを連携させることで、日本をハイパフォーマンス・コンピューティングの新時代へと導くことを目指しています。私たちの使命は、科学界と産業界の両方で探求できる実用的な量子HPCハイブリッド・ワークフローを開発・実証することです。これらの2つのシステムを接続することで、このビジョンの実現に向けて重要な一歩を踏み出すことができます」
      理研にIBM Quantum System Twoを設置することで、理研とIBMの研究者は、量子コンピューターが既知の古典的方法よりも速く、安価に、より正確に問題を解決できるという量子優位性を発揮するアルゴリズムの発見を目指してきたこれまでの成果をさらに拡大することになります。これまでの成果には、最近、科学雑誌「[Science Advances](https://doi.org/10.1126/sciadv.adu9991)」に論文として掲載された、自然界や有機系に広く存在する化合物である硫化鉄の電子構造を正確にモデル化するためのサンプルベースの量子対角化（SQD、sample-based quantum diagonalization）技術に基づく研究が含まれます。このような複雑なシステムを現実的にモデル化する能力は、化学の多くの問題に不可欠であり、歴史的にはフォールト・トレラントな量子コンピューターが必要であると考えられていました。SQDワークフローは、今日の量子コンピューターが強力な古典的インフラストラクチャーと統合することで科学的な価値を提供できることを最初に示した事例の1つです。
